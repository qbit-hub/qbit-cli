[package]
name = "qbit-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0.99"
notify = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0.25"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.15.0"
serial_test = "3.2.0"
proptest = "1.6.0"
insta = "1.42.2"
# Used only by tests/cli_upgrade.rs to run a local mock HTTP server so
# that upgrade-flow tests exercise the real HTTP-calling code in
# src/os/upgrade.rs without depending on the real GitHub API.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "qbit"
path = "src/main.rs"
