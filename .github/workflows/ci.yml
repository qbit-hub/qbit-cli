name: ci

on:
  push:
  pull_request:

# Default to read-only. CI never needs to write to the repo or create
# releases/tags — only release.yml's publish job needs write access.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: qbit
            arch: amd64
          - os: windows-latest
            binary_name: qbit.exe
            arch: x64
          - os: macos-latest
            binary_name: qbit
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Read pinned Rust toolchain version
        id: toolchain
        shell: bash
        run: |
          # rust-toolchain.toml is the single source of truth for the
          # Rust version used everywhere (local dev, CI, release).
          # Parsed here so both ci.yml and release.yml install the
          # exact same version without hardcoding it in more than one
          # place.
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel = "(.*)"/\1/')
          if [ -z "$version" ]; then
            echo "error: could not read [toolchain] channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --release

      - name: Verify binary name (Cargo [[bin]] check)
        shell: bash
        run: |
          if [ ! -f "target/release/${{ matrix.binary_name }}" ]; then
            echo "error: expected target/release/${{ matrix.binary_name }} — Cargo.toml [[bin]] naming may be wrong" >&2
            find target/release -maxdepth 1 -type f >&2
            exit 1
          fi

      # --- Packaging E2E: build an unsigned, disposable test package on every PR ---
      # This never creates a GitHub release or tag; dist/ is discarded at job end.

      - name: Install WiX (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build test .deb (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x scripts/package/build-linux-deb.sh
          ./scripts/package/build-linux-deb.sh 0.0.1 "${{ matrix.arch }}" \
            "target/release/${{ matrix.binary_name }}" dist

      - name: E2E install / run / uninstall (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(find dist -maxdepth 1 -name "*.deb" | head -n1)
          sudo dpkg -i "$pkg"
          out="$(qbit --help)"
          echo "qbit --help -> $out"
          sudo dpkg -r qbit-cli
          if command -v qbit >/dev/null 2>&1; then
            echo "error: qbit still on PATH after uninstall" >&2
            exit 1
          fi

      - name: Build test .pkg (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          chmod +x scripts/package/build-macos.sh
          ./scripts/package/build-macos.sh 0.0.1 "${{ matrix.arch }}" \
            "target/release/${{ matrix.binary_name }}" dist

      - name: E2E install / run / uninstall (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(find dist -maxdepth 1 -name "*.pkg" | head -n1)
          sudo installer -pkg "$pkg" -target /
          out="$(/usr/local/bin/qbit --help)"
          echo "qbit --help -> $out"
          sudo pkgutil --forget com.qbit-click.qbit-cli
          sudo rm -f /usr/local/bin/qbit

      - name: Build test .msi (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\package\build-windows.ps1 -Version "0.0.1" -Arch "${{ matrix.arch }}" `
            -BinaryPath "target\release\${{ matrix.binary_name }}" -OutDir dist

      - name: E2E install / run / uninstall (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn" -Wait
          # Refresh PATH for this process from the machine+user environment
          $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User")
          $out = & qbit --help
          Write-Host "qbit --help -> $out"
          Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait
