name: release

on:
  push:
    tags:
      - "v*"

# Default to read-only. Only the publish job (which creates the
# GitHub Release) needs write access — build jobs never need it.
permissions:
  contents: read

jobs:
  build:
    name: build-and-sign (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            binary_name: qbit
            arch: amd64
          - os: macos-latest
            artifact: macos
            binary_name: qbit
            arch: arm64
          - os: windows-latest
            artifact: windows
            binary_name: qbit.exe
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Read pinned Rust toolchain version
        id: toolchain
        shell: bash
        run: |
          # rust-toolchain.toml is the single source of truth for the
          # Rust version, shared with ci.yml so both workflows always
          # build with the exact same compiler.
          version=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/channel = "(.*)"/\1/')
          if [ -z "$version" ]; then
            echo "error: could not read [toolchain] channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --release

      - name: Sign binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }} # 📝 اینجا یک cert باینری به صورت base64 قرار دهید.
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) { Write-Host "WINDOWS_CERT_PFX not set, skipping signing"; return }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          & "$env:ProgramFiles\Windows Kits\10\bin\x64\signtool.exe" sign `
            /f $pfxPath `
            /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.sectigo.com `
            /td sha256 `
            /fd sha256 `
            target\release\${{ matrix.binary_name }}

      - name: Import macOS signing certificate
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }} # 📝 یک فایل p12 base64 شده اینجا قرار بدهید. Must contain BOTH the Developer ID Application and Developer ID Installer certificates.
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "MACOS_CERT_P12 not set — build-macos.sh will produce an unsigned artifact."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security unlock-keychain -p "" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

      - name: Sign binary (Linux, optional GPG)
        if: matrix.os == 'ubuntu-latest'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY not set, skipping signing"
            exit 0
          fi

          # import key
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

          # allow loopback pinentry (required for GitHub Actions)
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

          # sign
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --output target/release/${{ matrix.binary_name }}.sig \
            --detach-sign target/release/${{ matrix.binary_name }}
      - name: Verify tag matches Cargo.toml version
        id: version
        shell: bash
        run: |
          # Tag must be exactly vX.Y.Z (three numeric components).
          # Malformed tags like "vtest", "vfoo", "v1" are rejected
          # here with a clear error rather than falling through to a
          # confusing string-mismatch failure below.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag '$GITHUB_REF_NAME' is not a valid version tag. Expected format: vX.Y.Z (e.g. v1.2.3)." >&2
            exit 1
          fi

          # Cargo.toml is the single source of truth for the version.
          # The pushed tag must match it exactly (after stripping the
          # leading 'v'), or the release is aborted. This prevents a
          # tag/Cargo.toml mismatch from silently shipping installers
          # whose filename claims one version while the binary itself
          # (via CARGO_PKG_VERSION) reports another.
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$cargo_version" != "$tag_version" ]; then
            echo "error: tag version ($tag_version) does not match Cargo.toml version ($cargo_version)" >&2
            echo "Bump [package] version in Cargo.toml to $tag_version before tagging, or re-tag to match $cargo_version." >&2
            exit 1
          fi

          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Verify built binary reports the correct version
        shell: bash
        run: |
          # Post-build check: the compiled binary's own --version output
          # must match the tag/Cargo.toml version verified above. This
          # catches cases where CARGO_PKG_VERSION could diverge from
          # what was checked pre-build (e.g. a caching or checkout bug),
          # by verifying the actual artifact, not just source files.
          binary="target/release/${{ matrix.binary_name }}"
          reported_version="$("$binary" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          expected_version="${{ steps.version.outputs.version }}"

          if [ "$reported_version" != "$expected_version" ]; then
            echo "error: built binary reports version '$reported_version', expected '$expected_version'" >&2
            exit 1
          fi

      - name: Install WiX (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build Linux .deb
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x scripts/package/build-linux-deb.sh
          ./scripts/package/build-linux-deb.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.arch }}" \
            "target/release/${{ matrix.binary_name }}" \
            dist

      - name: Verify DEB package version matches tag
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          deb_file=$(find dist -maxdepth 1 -name "*.deb" | head -n1)
          deb_version=$(dpkg-deb --field "$deb_file" Version)
          expected_version="${{ steps.version.outputs.version }}"
          if [ "$deb_version" != "$expected_version" ]; then
            echo "error: DEB package reports Version '$deb_version', expected '$expected_version'" >&2
            exit 1
          fi

      - name: Build macOS .pkg
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }} # مثلا: "Developer ID Application: Your Name (TEAMID)"
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }} # مثلا: "Developer ID Installer: Your Name (TEAMID)"
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: |
          chmod +x scripts/package/build-macos.sh
          ./scripts/package/build-macos.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.arch }}" \
            "target/release/${{ matrix.binary_name }}" \
            dist

      - name: Verify PKG package version matches tag
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          pkg_file=$(find dist -maxdepth 1 -name "*.pkg" | head -n1)
          # pkgutil --check-signature/--payload-files don't expose the
          # version directly; the distribution.xml pkg-ref version is
          # authoritative and was already rendered with the same
          # $VERSION build-macos.sh received, but we verify the actual
          # built artifact's embedded metadata rather than trusting
          # the render step alone.
          expand_dir="$(mktemp -d)"
          pkgutil --expand "$pkg_file" "$expand_dir/expanded"
          pkg_version=$(/usr/libexec/PlistBuddy -c "Print :version" "$expand_dir/expanded/PackageInfo" 2>/dev/null || \
            grep -oE 'version="[0-9]+\.[0-9]+\.[0-9]+"' "$expand_dir/expanded/PackageInfo" | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          expected_version="${{ steps.version.outputs.version }}"
          if [ "$pkg_version" != "$expected_version" ]; then
            echo "error: PKG package reports version '$pkg_version', expected '$expected_version'" >&2
            exit 1
          fi
          rm -rf "$expand_dir"

      - name: Build Windows .msi
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\package\build-windows.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Arch "${{ matrix.arch }}" `
            -BinaryPath "target\release\${{ matrix.binary_name }}" `
            -OutDir dist

      - name: Verify MSI package version matches tag
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist\*.msi | Select-Object -First 1
          # Query the MSI's own ProductVersion property via Windows
          # Installer's COM API rather than trusting the filename.
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.GetType().InvokeMember(
              "OpenDatabase", "InvokeMethod", $null, $installer,
              @($msi.FullName, 0)
          )
          $view = $database.GetType().InvokeMember(
              "OpenView", "InvokeMethod", $null, $database,
              @("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
          )
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
          $msiVersion = $record.GetType().InvokeMember("StringData", "GetProperty", $null, $record, @(1))

          $expectedVersion = "${{ steps.version.outputs.version }}"
          if ($msiVersion -ne $expectedVersion) {
              Write-Error "MSI ProductVersion is '$msiVersion', expected '$expectedVersion'"
              exit 1
          }

      - name: Verify exactly one installer was produced
        shell: bash
        run: |
          count=$(find dist -maxdepth 1 -type f \( -name "*.deb" -o -name "*.pkg" -o -name "*.msi" \) | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "error: expected exactly 1 installer in dist/, found $count" >&2
            find dist -maxdepth 1 -type f >&2
            exit 1
          fi

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          for f in *.deb *.pkg *.msi; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256" 2>/dev/null || shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: qbit-${{ matrix.artifact }}
          path: |
            dist/*.deb
            dist/*.pkg
            dist/*.msi
            dist/*.sha256

  release:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    # Only this job needs write access, to create the GitHub Release.
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
